<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Entry</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 50px;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], 
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Student Record</h2>
    <form id="studentForm">
        <div class="form-group">
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" name="studentName" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
            <label for="course">Course</label>
            <input type="text" id="course" name="course" placeholder="e.g. Computer Science" required>
        </div>

        <div class="form-group">
            <label for="yearLevel">Year Level</label>
            <select id="yearLevel" name="yearLevel" required>
                <option value="" disabled selected>Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
        </div>

        <button type="submit">Save Record</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCItAlyE_gTJNK6ucxbEkorRc3ZfB8KrPY",
    authDomain: "database-64e22.firebaseapp.com",
    projectId: "database-64e22",
    storageBucket: "database-64e22.firebasestorage.app",
    messagingSenderId: "111951908736",
    appId: "1:111951908736:web:453b0c656dd3e447ccfb65",
    measurementId: "G-275N9PNHT1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('studentForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('studentName').value.trim();
        const course = document.getElementById('course').value.trim();
        const year = document.getElementById('yearLevel').value;

        try {
            await addDoc(collection(db, "students"), {
                name,
                course,
                yearLevel: year,
                createdAt: serverTimestamp()
            });

            alert(`Record Saved to Firebase!\nName: ${name}\nCourse: ${course}\nYear: ${year}`);
            this.reset();
        } catch (error) {
            console.error("Error saving to Firebase:", error);
            alert("Failed to save record. Check Firebase config and Firestore rules.");
        }
    });
</script>

</body>
</html>
