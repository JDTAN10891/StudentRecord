<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Entry</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 50px;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], 
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            display: none;
        }
        .status.ok {
            display: block;
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #a5d6a7;
        }
        .status.error {
            display: block;
            background: #ffebee;
            color: #b71c1c;
            border: 1px solid #ef9a9a;
        }
        .records {
            margin-top: 18px;
            border-top: 1px solid #e8e8e8;
            padding-top: 12px;
        }
        .records h3 {
            margin: 0 0 8px;
            color: #333;
            font-size: 16px;
        }
        .records ul {
            margin: 0;
            padding-left: 18px;
            color: #444;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Student Record</h2>
    <form id="studentForm">
        <div class="form-group">
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" name="studentName" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
            <label for="course">Course</label>
            <input type="text" id="course" name="course" placeholder="e.g. Computer Science" required>
        </div>

        <div class="form-group">
            <label for="yearLevel">Year Level</label>
            <select id="yearLevel" name="yearLevel" required>
                <option value="" disabled selected>Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
        </div>

        <button type="submit">Save Record</button>
    </form>
    <p id="status" class="status" aria-live="polite"></p>

    <div class="records">
        <h3>Recent Records</h3>
        <ul id="recordList">
            <li>Loading records...</li>
        </ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
        getFirestore,
        collection,
        addDoc,
        serverTimestamp,
        getDocs,
        query,
        orderBy,
        limit
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCItAlyE_gTJNK6ucxbEkorRc3ZfB8KrPY",
    authDomain: "database-64e22.firebaseapp.com",
    projectId: "database-64e22",
    storageBucket: "database-64e22.firebasestorage.app",
    messagingSenderId: "111951908736",
    appId: "1:111951908736:web:453b0c656dd3e447ccfb65",
    measurementId: "G-275N9PNHT1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const statusEl = document.getElementById('status');
    const recordList = document.getElementById('recordList');

    function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`;
    }

    async function loadRecentRecords() {
        try {
            const recordsQuery = query(collection(db, "students"), orderBy("createdAt", "desc"), limit(5));
            const snapshot = await getDocs(recordsQuery);

            if (snapshot.empty) {
                recordList.innerHTML = '<li>No records yet.</li>';
                return;
            }

            recordList.innerHTML = '';
            snapshot.forEach((docItem) => {
                const data = docItem.data();
                const listItem = document.createElement('li');
                listItem.textContent = `${data.name} - ${data.course} (Year ${data.yearLevel})`;
                recordList.appendChild(listItem);
            });
        } catch (error) {
            console.error("Error loading records:", error);
            recordList.innerHTML = '<li>Unable to load records.</li>';
            setStatus(`Read failed: ${error.code || 'unknown'} - ${error.message}`, 'error');
        }
    }

    document.getElementById('studentForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('studentName').value.trim();
        const course = document.getElementById('course').value.trim();
        const year = document.getElementById('yearLevel').value;

        try {
            await addDoc(collection(db, "students"), {
                name,
                course,
                yearLevel: year,
                createdAt: serverTimestamp()
            });

            setStatus('Record saved to Firestore successfully.', 'ok');
            this.reset();
            await loadRecentRecords();
        } catch (error) {
            console.error("Error saving to Firebase:", error);
            setStatus(`Write failed: ${error.code || 'unknown'} - ${error.message}`, 'error');
        }
    });

    loadRecentRecords();
</script>

</body>
</html>
